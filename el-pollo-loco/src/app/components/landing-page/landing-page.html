<div class="page-wrapper">
    <div class="background"></div>

    @if (gameService.gameState() === 'menu') {
    <h1 class="game-title">El Pollo Loco</h1>
    <div class="canvas-wrapper">
        <div class="menu-overlay">
            <div class="menu-top-left">
                <button class="btn-menu" routerLink="/impressum">Legal Notice</button>
                <button class="btn-menu" (click)="openControls()">Controls</button>
            </div>
            <div class="menu-top-right">
                <img class="mute-icon" role="button"
                    src="/assets/icons/{{ audioService.isMuted() ? 'sound_off' : 'sound_on' }}.png" alt="Sound"
                    (click)="audioService.toggleMute()" />
            </div>
            <button class="btn-start" (click)="startGame()">Start</button>
        </div>
        <img class="intro-image" src="assets/img/9_intro_outro_screens/startscreen_1.png" alt="El Pollo Loco" />
    </div>
    }

    @if (gameService.gameState() !== 'menu') {
    <app-game-canvas />
    }

    @if (controlsOpen()) {
    <div class="dialog-backdrop" (click)="closeControls()">
        <div class="dialog" (click)="$event.stopPropagation()">
            <button class="dialog-close" (click)="closeControls()">✕</button>
            <h2>Controls</h2>
            <ul>
                <li>
                    <span class="key">A</span>
                    Laufen links
                </li>
                <li>
                    <span class="key">D</span>
                    Laufen rechts
                </li>
                <li>
                    <span class="key">W</span>
                    Springen
                </li>
                <li>
                    <span class="key">Space</span>
                    Flasche werfen
                </li>
            </ul>
        </div>
    </div>
    }
</div>
